[pytest]
# Test discovery
testpaths = tests
python_files = test-*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    sample: Sample file extraction tests
    spot_check: Random spot-check validation tests
    use_case: Use case coverage tests (DOE, Model, Result)
    browser: Browser-based verification tests using MCP Playwright
    regression: Parser adjustment regression tests
    integration: Integration tests requiring full setup

# Output configuration
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Performance settings
# Note: timeout requires pytest-timeout plugin: pip install pytest-timeout
# timeout = 30
